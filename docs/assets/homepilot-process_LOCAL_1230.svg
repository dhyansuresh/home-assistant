<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1740" viewBox="0 0 1600 1740" role="img" aria-labelledby="title desc">
<title id="title">HomePilot MVP process</title><desc id="desc">Stationary voice or mobile photo input reaches FastAPI and Gemini. Vision supplies product evidence when needed. After task confirmation, capture stops and MCP executes database operations, returning the actual result.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#a9b4c1" stroke-width="1.4"/></marker></defs>
<rect width="1600" height="1740" rx="24" fill="#10151c"/>
<text x="800" y="55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#e6edf3">HomePilot · MVP process</text>
<text x="800" y="90" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#aebcca">Two input modes. One assistant and shared household data.</text>
<rect x="220" y="125" width="480" height="105" rx="18" fill="#352b0d" stroke="#796326" stroke-width="1.5"/>
<text x="460.0" y="173.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#f0d88d">Stationary laptop / iPhone</text>
<text x="460.0" y="205.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#f0d88d">Listening enabled · camera idle</text>
<rect x="900" y="125" width="480" height="105" rx="18" fill="#352b0d" stroke="#796326" stroke-width="1.5"/>
<text x="1140.0" y="158.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#f0d88d">Separate phone / iPhone</text>
<text x="1140.0" y="190.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#f0d88d">Point and click · one photo</text>
<text x="1140.0" y="219.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#f0d88d">No wake phrase or microphone</text>
<rect x="220" y="275" width="480" height="110" rx="18" fill="#352b0d" stroke="#796326" stroke-width="1.5"/>
<text x="460.0" y="311.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#f0d88d">“Hey HomePilot”</text>
<text x="460.0" y="343.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#f0d88d">Continuous camera capture</text>
<text x="460.0" y="372.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#f0d88d">Speech-to-text · full conversation</text>
<path d="M460 230 V275" fill="none" stroke="#a9b4c1" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M460 385 V415 H800 V450" fill="none" stroke="#a9b4c1" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M1140 230 V415 H800" fill="none" stroke="#a9b4c1" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="560" y="450" width="480" height="95" rx="18" fill="#352b0d" stroke="#796326" stroke-width="1.5"/>
<text x="800.0" y="493.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#f0d88d">FastAPI</text>
<text x="800.0" y="525.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#f0d88d">Validate inputs · manage task context</text>
<path d="M800 545 V610" fill="none" stroke="#a9b4c1" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="560" y="610" width="480" height="120" rx="18" fill="#352b0d" stroke="#796326" stroke-width="1.5"/>
<text x="800.0" y="651.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#f0d88d">Gemini LLM coordinator</text>
<text x="800.0" y="683.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#f0d88d">Understand the full conversation</text>
<text x="800.0" y="712.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#f0d88d">Choose tools and clarify intent</text>
<rect x="40" y="605" width="410" height="135" rx="18" fill="#163039" stroke="#407788" stroke-width="1.5"/>
<text x="245.0" y="653.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#c6e8ef">Visual recognition tool</text>
<text x="245.0" y="685.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#c6e8ef">Fine-tuned Hugging Face model</text>
<text x="245.0" y="714.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#c6e8ef">Served on AMD ROCm GPU</text>
<path d="M560 642 H450" fill="none" stroke="#a9b4c1" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="315" y="583" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#aebcca">When product identification is needed</text>
<path d="M450 703 H560" fill="none" stroke="#a9b4c1" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="280" y="770" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#aebcca">Returns candidates or unknown</text>
<rect x="1130" y="805" width="420" height="110" rx="18" fill="#352b0d" stroke="#796326" stroke-width="1.5"/>
<text x="1340.0" y="841.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#f0d88d">Clarify or correct</text>
<text x="1340.0" y="873.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#f0d88d">Ask for missing details</text>
<text x="1340.0" y="902.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#f0d88d">Accept user answers</text>
<path d="M1040 685 H1100 V840 H1130" fill="none" stroke="#a9b4c1" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="1280" y="730" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#aebcca">Missing information</text>
<path d="M1340 805 V495 H1040" fill="none" stroke="#a9b4c1" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="1340" y="472" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#aebcca">Reply updates the conversation</text>
<path d="M800 730 V900" fill="none" stroke="#a9b4c1" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="920" y="825" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#aebcca">Task understood</text>
<rect x="560" y="900" width="480" height="100" rx="18" fill="#352b0d" stroke="#796326" stroke-width="1.5"/>
<text x="800.0" y="945.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#f0d88d">Review and confirm task</text>
<text x="800.0" y="977.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#f0d88d">User confirms the intended action</text>
<path d="M1040 950 H1340 V915" fill="none" stroke="#a9b4c1" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="1310" y="977" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#aebcca">Needs correction</text>
<path d="M800 1000 V1060" fill="none" stroke="#a9b4c1" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="560" y="1060" width="480" height="100" rx="18" fill="#352b0d" stroke="#796326" stroke-width="1.5"/>
<text x="800.0" y="1105.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#f0d88d">Stop task capture</text>
<text x="800.0" y="1137.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#f0d88d">Stop transcription · freeze task</text>
<path d="M800 1160 V1220" fill="none" stroke="#a9b4c1" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="560" y="1220" width="480" height="100" rx="18" fill="#352b0d" stroke="#796326" stroke-width="1.5"/>
<text x="800.0" y="1265.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#f0d88d">Execute the confirmed task</text>
<text x="800.0" y="1297.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#f0d88d">Gemini selects · FastAPI calls</text>
<path d="M800 1320 V1380" fill="none" stroke="#a9b4c1" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="560" y="1380" width="480" height="115" rx="18" fill="#163039" stroke="#407788" stroke-width="1.5"/>
<text x="800.0" y="1418.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#c6e8ef">Python runtime MCP server</text>
<text x="800.0" y="1450.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#c6e8ef">Inventory · grocery list</text>
<text x="800.0" y="1479.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#c6e8ef">Last-added history</text>
<rect x="1130" y="1380" width="420" height="115" rx="18" fill="#163039" stroke="#407788" stroke-width="1.5"/>
<text x="1340.0" y="1418.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#c6e8ef">Shared PostgreSQL</text>
<text x="1340.0" y="1450.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#c6e8ef">Supabase is the current default</text>
<text x="1340.0" y="1479.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#c6e8ef">Inventory addition events</text>
<path d="M1040 1415 H1130" fill="none" stroke="#a9b4c1" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M1130 1460 H1040" fill="none" stroke="#a9b4c1" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="1340" y="1350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#aebcca">Validated reads / writes and results</text>
<path d="M800 1495 V1555" fill="none" stroke="#a9b4c1" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="560" y="1555" width="480" height="100" rx="18" fill="#183426" stroke="#46805b" stroke-width="1.5"/>
<text x="800.0" y="1600.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#d1ecd9">Display the actual result</text>
<text x="800.0" y="1632.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#d1ecd9">Updated list, inventory, or history</text>
<text x="800" y="1705" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#aebcca">List and history requests can skip vision. Stationary mode returns to wake listening when enabled.</text>
</svg>