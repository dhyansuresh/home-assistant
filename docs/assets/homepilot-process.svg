<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc">
<title id="title">HomePilot: how it works</title><desc id="desc">You say Hey HomePilot to wake the web app, then ask, optionally holding up a product. The HomePilot API sends photos to the product-recognition model, then the local qwen3 model understands the request and shows or adds grocery-list items stored locally, and HomePilot answers on screen. Requests other than the grocery list are declined, unknown products prompt a question, and photo-based adds need a yes.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#a9b4c1" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="1060" rx="24" fill="#10151c"/>
<text x="600.0" y="55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#e6edf3">HomePilot · how it works</text>
<text x="600.0" y="90" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#aebcca">Everything runs on your computer except voice transcription.</text>
<rect x="340.0" y="125" width="520" height="100" rx="18" fill="#352b0d" stroke="#796326" stroke-width="1.5"/>
<text x="600.0" y="167.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#f0d88d">Say “Hey HomePilot”</text>
<text x="600.0" y="199.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#f0d88d">Then ask · hold up a product if it&#x27;s about one</text>
<path d="M600 225 V270" fill="none" stroke="#a9b4c1" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="340.0" y="270" width="520" height="100" rx="18" fill="#2e2810" stroke="#796326" stroke-width="1.5"/>
<text x="600.0" y="312.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#f0d88d">Web app wakes up</text>
<text x="600.0" y="344.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#f0d88d">Eyes turn alert · listens (ElevenLabs) · camera on</text>
<path d="M600 370 V415" fill="none" stroke="#a9b4c1" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="340.0" y="415" width="520" height="100" rx="18" fill="#2e2810" stroke="#796326" stroke-width="1.5"/>
<text x="600.0" y="457.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#f0d88d">HomePilot API</text>
<text x="600.0" y="489.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#f0d88d">FastAPI on your computer</text>
<path d="M600 515 V560" fill="none" stroke="#a9b4c1" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="340.0" y="560" width="520" height="100" rx="18" fill="#2e2810" stroke="#796326" stroke-width="1.5"/>
<text x="600.0" y="602.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#f0d88d">Local AI (qwen3 via Ollama)</text>
<text x="600.0" y="634.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#f0d88d">Answers your question, or updates your list</text>
<path d="M600 660 V705" fill="none" stroke="#a9b4c1" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="340.0" y="705" width="520" height="100" rx="18" fill="#17303a" stroke="#477780" stroke-width="1.5"/>
<text x="600.0" y="747.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#c5e5ea">Grocery list</text>
<text x="600.0" y="779.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#c5e5ea">Add items or show the list · saved locally</text>
<path d="M600 805 V850" fill="none" stroke="#a9b4c1" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="340.0" y="850" width="520" height="95" rx="18" fill="#183223" stroke="#477d58" stroke-width="1.5"/>
<text x="600.0" y="890.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#cee8d5">HomePilot answers</text>
<text x="600.0" y="922.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#cee8d5">Shown on screen with the walking buddy</text>
<path d="M340.0 610 H290.0 V897 H340.0" fill="none" stroke="#a9b4c1" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="280.0" y="750" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#aebcca">General</text>
<text x="280.0" y="772" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#aebcca">questions</text>
<rect x="915" y="415" width="255" height="100" rx="18" fill="#17303a" stroke="#477780" stroke-width="1.5"/>
<text x="1042.5" y="457.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#c5e5ea">Recognition</text>
<text x="1042.5" y="489.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#c5e5ea">Products, fruit &amp; more</text>
<path d="M860 465 H915" fill="none" stroke="#a9b4c1" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M1042 515 V610 H860" fill="none" stroke="#a9b4c1" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="887" y="453" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#aebcca">Photo</text>
<text x="1052" y="545" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#aebcca">Best match</text>
<text x="1052" y="567" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#aebcca">or “unknown”</text>
<text x="600.0" y="995" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#aebcca">Also answers everyday questions (no internet). Buying things, device control and harmful requests are declined.</text>
<text x="600.0" y="1025" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#aebcca">Unknown products: it asks you to name them. Items from a photo are added only after you say “yes”.</text>
</svg>
